<!DOCTYPE html>
<html lang="ko">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="keyword" content="Mediforte">
        <meta name="description" content="Mediforte">
        <meta name="author" content="Mediforte">
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
        <link rel="stylesheet" href="static/css/swiper.css">
        <link rel="stylesheet" href="static/css/jquery.mCustomScrollbar.css">
        <link rel="stylesheet" href="static/css/style.css">
        <link rel="shortcut icon" type="image/jpg" href="static/images/fav.png" />
        <title>메디포르테</title>
    </head>

    <body>
        <div class="btn-open-chat js-open-chat">
            <span class="blind">채팅하기</span>
            <i class="chat-counter">3</i>
        </div>
        <div class="chat chat--content" style="display: block;">
            <div class="chat__header chat__header--has-product">
                <a href="#" class="open-chat-option js-chat-opt"><span class="blind">채팅메뉴열기</span></a>
                <div class="chat__opt">
                    <button type="button" class="chat__opt--notify js-alert-notify">알람켜기</button>
                    <button type="button" class="chat__opt--block js-alert-block">차단</button>
                    <button type="button" class="chat__opt--report js-alert-report">신고</button>
                    <button type="button" class="chat__opt--exit js-alert-exit">나가기</button>
                </div>
                <a href="#" class="close-chat js-chat-close"><span class="blind">채팅닫기</span></a>

                <div class="chat-product">
                    <div class="chat-product__thumb">
                        <img src="static/images/sample.png" alt="sample">
                    </div>
                    <dl class="chat-product__desc">
                        <dt>피코슈어PicoSure레이저</dt>
                        <dd class="price">18,900,000원 <a href="#" class="btn btn--round btn--black">구매하기</a></dd>
                    </dl>
                </div>
            </div>

            <!--chat body-->
            <div class="chat__body">
                <!--유저프로필사진 / 이름 -->
                <div class="chat-user">
                    <p class="chat-user__avatar">
                        <!--이미지 없으면 기본 배경이미지로 보임 chat_profile_base -->
                        <!-- <img src="static/images/sample.png" alt="avatar"> -->
                    </p>
                    <p class="chat-user__pos">마카오김메디칼</p>
                    <p class="chat-user__name">김준식님</p>
                </div>

                <div class="message-wrapper">
                    <p class="message-date-time">2021. 10. 14. 오후 12:06</p>

                    <!--message card-->
                    <!--message  보낸사람 / 상대 -->
                    <div class="message-card message-card--sender">
                        <p class="message-card__avatar">
                            <img src="static/images/sample.png" alt="avatar">
                        </p>
                        <div class="message-card__content">
                            <p class="message-card__user">Jeong-Han Kim</p>
                            <div class="message-card__text">
                                <p>안녕하세요. <br>사이노슈어의 피코슈어장비에 더 자세히 알고 싶습니다.</p>
                            </div>
                        </div>
                    </div>
                    

                   <!--message 본인 -->
                    <div class="message-card message-card--receiver">
                        <div class="message-card__content">
                            <div class="message-card__text">
                                <p>관심있어하시는 피코슈어장비에 대한 자세한 정보는 참고하시라고 보내드립 니다.</p>
                                <a href="#" class="btn btn--round-s btn--white">제품 상세보기</a>
                            </div>
                        </div>
                    </div>

                    <div class="message-card message-card--receiver">
                        <div class="message-card__content">
                            <div class="message-card__text">
                                <p>관심있어하시는 피코슈어장비에 대한 자세한 정보는 참고하시라고 보내드립 니다.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--//chat body-->


            <!-- message input (footer) -->
            <div class="message-footer">
                <div class="message-footer__content">
                    <div class="message-footer__btns">
                        <button type="button" class="btn-emoji"><span class="blind">EMOJI</span></button>
                        <button type="button" class="btn-attach"><span class="blind">파일첨부</span></button>
                    </div>
                    <div class="message-footer__text">
                        <textarea class="js-auto-textarea" onkeydown="resize(this)" onkeyup="resize(this)"
                            name="your text" placeholder="메시지를 남겨주세요" id=""></textarea>
                        <button class="btn-send-message"><span class="blind">전송</span></button>
                    </div>
                </div>
            </div>
        </div>

        <script src="static/js/jquery-1.12.1.min.js"></script>
        <script src="static/js/jquery-migrate-1.4.1.min.js"></script>
        <script src="static/js/swiper.min.js"></script>
        <script src="static/js/jquery.mCustomScrollbar.min.js"></script>
        <script src="static/js/front.js"></script>
        <script>
           
        </script>
    </body>

</html>
