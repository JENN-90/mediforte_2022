<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keyword" content="Mediforte">
    <meta name="description" content="Mediforte">
    <meta name="author" content="Mediforte">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="shortcut icon" type="image/jpg" href="static/images/fav.png" />
    <title>messenger app ui</title>
</head>

<body>


    <div class="chat-alert">
        <div class="chat-alert__box">
            <div class="chat-alert__title chat-alert__title--warn">
                <h3>Lorem ipsum dolor, sit amet consectetur </h3>
            </div>
            <div class="chat-alert__content">
                <form action="">
                    <ul class="report-select report-select-step1">
                        <li class="report-select__list">
                            <label for="reportSelect3" class="radio-box">
                                <input type="radio" id="reportSelect3" name="reportSelect" checked>선택
                                <span class="checkmark radio-box__checkmark"></span>
                            </label>
                            <ul class="report-select report-select-step2">
                                <li class="report-select__list"><label for="reportSelect1" class="check-box">
                                        <input type="checkbox" name="reportSelect1" checked>Select3
                                        <span class="checkmark check-box__checkmark"></span>
                                    </label></li>
                                <li class="report-select__list"><label for="reportSelect2" class="check-box">
                                        <input type="checkbox" id="reportSelect2" name="reportSelect2">Select3
                                        <span class="checkmark check-box__checkmark"></span>
                                    </label></li>
                            </ul>
                        </li>
                        <li class="report-select__list"><label for="reportSelect4" class="radio-box">
                                <input type="radio" id="reportSelect4" name="reportSelect">Select2
                                <span class="checkmark radio-box__checkmark"></span>
                            </label></li>
                    </ul>

                    <button class="btn btn--round-s btn--lgray js-btn-report">확인</button>
                </form>
            </div>
            <p class="btn-close-alert js-close-alert"><span class="blind">닫기</span></p>
        </div>
    </div>


    <script src="static/js/jquery-1.12.1.min.js"></script>
    <script src="static/js/jquery-migrate-1.4.1.min.js"></script>
    <script src="static/js/front.js"></script>
</body>

</html>
