<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keyword" content="Mediforte">
    <meta name="description" content="Mediforte">
    <meta name="author" content="Mediforte">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="shortcut icon" type="image/jpg" href="static/images/fav.png" />
    <title>messenger UI</title>
</head>

<body>


    <div class="chat chat--list">
        <div class="chat__header">
            <a href="#" class="open-chat-option js-chat-opt"><span class="blind">채팅메뉴열기</span></a>
            <a href="#" class="close-chat js-chat-close"><span class="blind">채팅메뉴열기</span></a>
        </div>
        <div class="chat-product">
            <div class="chat-product__thumb">
                <img src="static/images/sample.png" alt="sample">
            </div>
            <dl class="chat-product__desc">
                <dt>Messenger App Screen UI</dt>
                <dd class="price">999,999,999원</dd>
            </dl>
            <a href="#" class="btn btn--round btn--black">구매하기</a>
        </div>
        <!--검색영역-->
        <div class="chat-search">
            <a href="#" class="btn-prev--arrow"><span class="blind">이전단계</span></a>
            <div class="inputbox--search inputbox">
                <input type="text" id="chatSearch" class="inputbox__input" title="검색어입력" value="정동그라미">
                <button type="button" class="btn-search"><span class="blind">검색버튼</span></button>
            </div>
        </div>
        <!--검색영역-->

        <ul class="chat-list">
            <li>
                <p class="chat-list__thumb"><img src="static/images/sample.png" alt="sample"></p>
                <div class="chat-list__content">
                    <p class="chat-list__username">정동그라미 <button class="btn-mute-alert"><span
                                class="blind">알림설정</span></button></p>
                    <div class="chat-list__conv">
                        <p>Our mission is not to bother you. But we can only share information about what happens with poor animals in this cruel world.🐈💜.</p>
                        <span class="chat-list__date">4일</span>
                    </div>
                </div>
                <p class="chat-list__state"><i></i></p>
            </li>
        </ul>
    </div>
    <script src="static/js/jquery-1.12.1.min.js"></script>
    <script src="static/js/jquery-migrate-1.4.1.min.js"></script>
    <script src="static/js/front.js"></script>
</body>

</html>
